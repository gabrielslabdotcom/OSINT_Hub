[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-hub"
version = "0.1.0"
description = "Live OSINT collection, cross-source correlation, and optional LLM attack-surface analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OSINT_Hub contributors" }]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.34"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "anthropic>=0.34"]

[project.scripts]
osint-hub = "osint_hub.cli:main"

[tool.setuptools.packages.find]
include = ["osint_hub*"]

[tool.setuptools.package-data]
osint_hub = ["webapp/static/**/*"]
